name: Build VES APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    - name: Create Android Scaffold
      run: flutter create . --platforms=android --org com.ves

    - name: Fix Compile SDK Version to 34
      run: |
        sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/g' android/app/build.gradle || true
        sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 34/g' android/app/build.gradle || true

    - name: Build Release APK
      run: flutter build apk --release
