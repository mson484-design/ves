name: Build VES APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Android Structure
      run: flutter create . --platforms=android --org com.ves

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: |
        flutter build apk --release --dart-define=flutter.compileSdkVersion=36 --dart-define=flutter.targetSdkVersion=34 || \
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ves-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
